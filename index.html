<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A calm, community-maintained directory and personal account checklist."
    />
    <meta name="theme-color" content="#f6f7f5" />
    <title>Sinwar-7 — Personal account checklist</title>
    <script>
      (() => {
        try {
          const saved = window.localStorage.getItem('sinwar7:theme');
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          const theme =
            saved === 'dark' || (saved !== 'light' && prefersDark)
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch {
          const theme = window.matchMedia('(prefers-color-scheme: dark)')
            .matches
            ? 'dark'
            : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
